[project]
name = "padel-bot"
version = "0.1.0"
description = "Telegram bot showing available padel court slots in Batumi (Reservio)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "cachetools>=5.5",
]

[project.scripts]
padel-bot = "padel_bot.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["padel_bot"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
