# Fly.io config. Long-polling worker: no HTTP services, one always-on machine.
# Run exactly ONE machine (fly deploy --ha=false, fly scale count 1): two machines polling
# with the same bot token get TelegramConflictError, and the stats volume attaches to one.
app = "padel-batumi-bot"
primary_region = "fra"

[build]

[env]
  STATS_DB_PATH = "/data/stats.sqlite3"

# Persistent volume for the stats database: fly volumes create padel_data --size 1 --region fra
[mounts]
  source = "padel_data"
  destination = "/data"

# 256mb is not enough: importing aiogram alone takes ~160MB and the process gets OOM-killed.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Restart on any exit, without a retry limit. The bot exits with code 1 when the monitor dies
# (main.py serve): with the default on-failure policy a crash loop would leave the machine
# stopped for good after the retries run out. Each restart alerts ADMIN_IDS.
[[restart]]
  policy = "always"
